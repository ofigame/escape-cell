# Brickville iPhone test build in the cloud, no Mac needed (same setup as Escape Cell's ios.yml, without the store part:
# nothing is sent to App Store Connect / TestFlight).
#   1. Linux runner: Unity (GameCI Docker image) exports the iOS Xcode project.
#   2. macOS runner: Xcode compiles it into an unsigned, ad-hoc signed .ipa for Sideloadly.
# Started by pushing a tag brick-ios-<anything> (the Escape Cell builds use ios-* / appstore-* and are not affected).
#
# Repository secrets used: UNITY_EMAIL, UNITY_PASSWORD, UNITY_LICENSE (and optional DOCKERHUB_USERNAME / DOCKERHUB_TOKEN).

name: Brickville iOS build

on:
  workflow_dispatch:
  push:
    tags: ['brick-ios-*']

concurrency:
  group: brickville-ios
  cancel-in-progress: true

jobs:
  unity:
    name: Unity → Xcode project
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      UNITY_IMAGE: unityci/editor:ubuntu-6000.6.4f1-ios-3
    steps:
      - name: Free disk space (the Unity iOS image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          tool-cache: true
          docker-images: true
          swap-storage: true

      - name: Make room
        run: |
          sudo rm -rf /usr/local/share/boost /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/share/swift \
            /opt/az /usr/local/share/powershell /usr/local/share/chromium /usr/local/julia* /opt/pipx /usr/lib/jvm \
            /usr/share/miniconda /opt/hostedtoolcache || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h / /mnt

      # Extra swap so Unity's iOS shader compilation is not killed (exit 137); on /mnt when it is a separate disk.
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          ROOT=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          ROOTDEV=$(df --output=source / | tail -1)
          MNT=0; MNTDEV=""
          if [ -d /mnt ]; then MNT=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9); MNTDEV=$(df --output=source /mnt | tail -1); fi
          if [ -n "$MNTDEV" ] && [ "$MNTDEV" != "$ROOTDEV" ] && [ "$MNT" -ge 8 ]; then F=/mnt/swapfile; A=$(( MNT - 3 )); else F=/swapfile; A=$(( ROOT - 30 )); fi
          [ "$A" -gt 24 ] && A=24
          echo "root ${ROOT} GB free ($ROOTDEV), mnt ${MNT} GB free ($MNTDEV): swap ${A} GB at $F"
          if [ "$A" -ge 4 ]; then
            sudo fallocate -l ${A}G $F || sudo dd if=/dev/zero of=$F bs=1M count=$(( A * 1024 ))
            sudo chmod 600 $F && sudo mkswap $F && sudo swapon $F
          else
            echo "::warning::No room for a swap file - the Unity export may run out of memory (exit 137)"
          fi
          sudo sysctl vm.swappiness=90
          swapon --show
          free -h

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the Unity image
        run: |
          for i in 1 2 3 4 5; do
            if docker pull "$UNITY_IMAGE"; then exit 0; fi
            echo "::warning::Pull attempt $i failed (Docker Hub limit?) - waiting before the next try"
            sleep $(( i * 60 ))
          done
          exit 1

      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Brickville-Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Brickville-Library-iOS-

      - name: Export Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.6.4f1
          buildName: Brickville
          dockerMemoryLimit: 34g
          dockerCpuLimit: 2
          versioning: None
        id: export1
        continue-on-error: true

      - name: Free memory before the second try
        if: steps.export1.outcome == 'failure'
        run: |
          sudo dmesg | grep -i -E "killed process|out of memory|oom" | tail -5 | while read -r l; do echo "::warning::$l"; done || true
          sudo git clean -ffdx -e Library || true
          sudo git checkout -- . || true
          sync && echo 3 | sudo tee /proc/sys/vm/drop_caches
          docker ps -aq | xargs -r docker rm -f || true
          sudo rm -rf build/iOS || true

      - name: Export Xcode project (second try)
        if: steps.export1.outcome == 'failure'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.6.4f1
          buildName: Brickville
          dockerMemoryLimit: 34g
          dockerCpuLimit: 2
          versioning: None

      - name: Pack Xcode project
        run: sudo tar -czf xcode-project.tgz -C build/iOS/Brickville .

      - uses: actions/upload-artifact@v4
        with:
          name: brickville-xcode-project
          path: xcode-project.tgz
          retention-days: 2

  xcode:
    name: Xcode → unsigned .ipa
    needs: unity
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: brickville-xcode-project

      - name: Unpack
        run: mkdir xcode && tar -xzf xcode-project.tgz -C xcode

      - name: Install CocoaPods dependencies
        working-directory: xcode
        run: |
          if [ -f Podfile ]; then pod install --repo-update; else echo "No Podfile"; fi

      - name: Compile without signing
        working-directory: xcode
        run: |
          if [ -d Unity-iPhone.xcworkspace ]; then TARGET="-workspace Unity-iPhone.xcworkspace -scheme Unity-iPhone"; else TARGET="-project Unity-iPhone.xcodeproj -target Unity-iPhone"; fi
          xcodebuild $TARGET -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/out" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40

      # Unity's own framework comes signed while the app is not; strip all signatures and ad-hoc sign the whole bundle
      # so Sideloadly can re-sign it (otherwise ApplicationVerificationFailed).
      - name: Ad-hoc sign
        working-directory: xcode
        run: |
          APP=$(ls -d out/Release-iphoneos/*.app)
          find "$APP" -name _CodeSignature -type d -prune -exec rm -rf {} +
          for fw in "$APP"/Frameworks/*.framework; do
            codesign --force --sign - --timestamp=none "$fw"
          done
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package .ipa
        working-directory: xcode
        run: |
          mkdir Payload
          cp -R out/Release-iphoneos/*.app Payload/
          zip -qry ../Brickville-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Brickville-unsigned-ipa
          path: Brickville-unsigned.ipa
          retention-days: 14
