# Builds the iPhone app in the cloud, no Mac needed.
#   1. Linux runner: Unity (GameCI Docker image) exports the iOS Xcode project.
#   2. macOS runner: Xcode compiles it.
# Two kinds, by the tag pushed:
#   ios-*                     a test build: unsigned .ipa (test ads, test tools) for Sideloadly.
#   appstore-<version>        the store build (e.g. appstore-1.0); appstore-1.0-b2 is another build of 1.0: live ads, no test tools, signed for the App Store
#                             and uploaded to App Store Connect (TestFlight first, then submitted from there).
#                             The build number is the run number.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_EMAIL, UNITY_PASSWORD  - the Unity account that owns the license
#   UNITY_LICENSE                - contents of the Unity license file (Unity_lic.ulf)
# For the store build also (App Store Connect > Users and Access > Integrations > Team Keys, role Admin):
#   APPLE_TEAM_ID                - the Apple Developer team id (10 characters, Membership details)
#   APPSTORE_API_KEY_ID          - the API key's Key ID
#   APPSTORE_API_ISSUER_ID       - the Issuer ID shown above the keys
#   APPSTORE_API_KEY             - the contents of the downloaded AuthKey_XXXX.p8 file

name: iOS build

on:
  workflow_dispatch:
  push:
    tags: ['ios-*', 'appstore-*']

# A newer iOS build cancels one still running of the same kind (only the latest push matters); a store build and a
# test build do not cancel each other.
concurrency:
  group: ios-build-${{ startsWith(github.ref_name, 'appstore-') && 'store' || 'test' }}
  cancel-in-progress: true

jobs:
  unity:
    name: Unity → Xcode project
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Optional Docker Hub login (repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN): anonymous pulls of the
      # big Unity image share a small per-IP limit on GitHub's runners and often fail with "toomanyrequests".
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      UNITY_IMAGE: unityci/editor:ubuntu-6000.6.4f1-ios-3
    steps:
      - name: Free disk space (the Unity iOS image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          tool-cache: true
          docker-images: true
          swap-storage: true

      # More room on the root disk, where the ~15 GB Unity image is unpacked: everything else big this build never uses.
      - name: Make room
        run: |
          sudo rm -rf /usr/local/share/boost /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/share/swift \
            /opt/az /usr/local/share/powershell /usr/local/share/chromium /usr/local/julia* /opt/pipx /usr/lib/jvm \
            /usr/share/miniconda /opt/hostedtoolcache || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h / /mnt

      # The hosted runner's RAM is tight for Unity's iOS shader compilation; without extra swap the build can be
      # killed by the OOM killer (exit code 137). Where it goes depends on the runner's disks (see below).
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          # Swap on /mnt when it is a separate scratch disk with room; otherwise on the root disk, but always keeping
          # 30 GB free there for the ~15 GB Unity image and the build (a swap file that ate that room ended in exit 125).
          ROOT=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          ROOTDEV=$(df --output=source / | tail -1)
          MNT=0; MNTDEV=""
          if [ -d /mnt ]; then MNT=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9); MNTDEV=$(df --output=source /mnt | tail -1); fi
          if [ -n "$MNTDEV" ] && [ "$MNTDEV" != "$ROOTDEV" ] && [ "$MNT" -ge 8 ]; then F=/mnt/swapfile; A=$(( MNT - 3 )); else F=/swapfile; A=$(( ROOT - 30 )); fi
          [ "$A" -gt 24 ] && A=24
          echo "root ${ROOT} GB free ($ROOTDEV), mnt ${MNT} GB free ($MNTDEV): swap ${A} GB at $F"
          if [ "$A" -ge 4 ]; then
            sudo fallocate -l ${A}G $F || sudo dd if=/dev/zero of=$F bs=1M count=$(( A * 1024 ))
            sudo chmod 600 $F && sudo mkswap $F && sudo swapon $F
          else
            echo "::warning::No room for a swap file - the Unity export may run out of memory (exit 137)"
          fi
          sudo sysctl vm.swappiness=90
          swapon --show
          free -h
          df -h / /mnt

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Unity image is fetched here first, with a few retries a while apart when Docker Hub's pull limit is hit,
      # so the export step below finds it already on the runner.
      - name: Pull the Unity image
        run: |
          for i in 1 2 3 4 5; do
            if docker pull "$UNITY_IMAGE"; then exit 0; fi
            echo "::warning::Pull attempt $i failed (Docker Hub limit?) - waiting before the next try"
            sleep $(( i * 60 ))
          done
          echo "::error::Could not pull $UNITY_IMAGE - add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to log in"
          exit 1

      - uses: actions/checkout@v4

      # The store build: live ads instead of the test units and tools, the version from the tag, the run as the build.
      - name: Store build settings
        if: startsWith(github.ref_name, 'appstore-')
        run: |
          VERSION="${GITHUB_REF_NAME#appstore-}"
          VERSION="${VERSION%%-*}" # appstore-1.0-b2: another build of 1.0
          sed -i "s/^    iPhone: TEST_TOOLS$/    iPhone: REAL_ADS/" ProjectSettings/ProjectSettings.asset
          sed -i "s/^  bundleVersion: .*/  bundleVersion: $VERSION/" ProjectSettings/ProjectSettings.asset
          sed -i "/^  buildNumber:/,/^  [a-zA-Z]/ s/^    iPhone: .*/    iPhone: $GITHUB_RUN_NUMBER/" ProjectSettings/ProjectSettings.asset
          grep -n "iPhone: REAL_ADS" ProjectSettings/ProjectSettings.asset || { echo "::error::define not set"; exit 1; }
          grep -n "bundleVersion\|    iPhone: $GITHUB_RUN_NUMBER" ProjectSettings/ProjectSettings.asset

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-

      - name: Export Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.6.4f1
          buildName: EscapeCell
          # By default the container gets 95% of the runner's ~8 GB and is killed (exit 137) when IL2CPP needs more.
          # A higher limit lets it spill into the swap file added above.
          dockerMemoryLimit: 34g
          # Fewer cores = fewer shader compilers and IL2CPP jobs at once = a lower memory peak (the 2-core runner built fine).
          dockerCpuLimit: 2
          versioning: None
        id: export1
        continue-on-error: true

      # Memory on the hosted runner is borderline: the export is sometimes killed (exit 137) and passes on a re-run.
      # So one automatic second try, after freeing the page cache and showing what memory and swap are left.
      - name: Free memory before the second try
        if: steps.export1.outcome == 'failure'
        run: |
          # What was killed and how much memory is left, as annotations (readable on the run page without logs).
          sudo dmesg | grep -i -E "killed process|out of memory|oom" | tail -5 | while read -r l; do echo "::warning::$l"; done || true
          echo "::warning::$(free -h | tr '\n' ' ')"
          echo "::warning::$(swapon --show --noheadings | tr '\n' ' ')"
          sudo git clean -ffdx -e Library || true
          sudo git checkout -- . || true
          # (the checkout undid the store build settings: put them back)
          if [[ "$GITHUB_REF_NAME" == appstore-* ]]; then
            VERSION="${GITHUB_REF_NAME#appstore-}"; VERSION="${VERSION%%-*}"
            sudo sed -i "s/^    iPhone: TEST_TOOLS$/    iPhone: REAL_ADS/" ProjectSettings/ProjectSettings.asset
            sudo sed -i "s/^  bundleVersion: .*/  bundleVersion: $VERSION/" ProjectSettings/ProjectSettings.asset
            sudo sed -i "/^  buildNumber:/,/^  [a-zA-Z]/ s/^    iPhone: .*/    iPhone: $GITHUB_RUN_NUMBER/" ProjectSettings/ProjectSettings.asset
            grep -n "iPhone: REAL_ADS" ProjectSettings/ProjectSettings.asset || { echo "::error::store settings lost"; exit 1; }
          fi
          sync && echo 3 | sudo tee /proc/sys/vm/drop_caches
          docker ps -aq | xargs -r docker rm -f || true
          sudo rm -rf build/iOS || true
          swapon --show
          free -h

      - name: Export Xcode project (second try)
        if: steps.export1.outcome == 'failure'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.6.4f1
          buildName: EscapeCell
          dockerMemoryLimit: 34g
          dockerCpuLimit: 2
          versioning: None

      # Tar keeps the execute bits on Unity's build scripts, which a plain artifact upload would drop.
      - name: Pack Xcode project
        run: sudo tar -czf xcode-project.tgz -C build/iOS/EscapeCell .

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.tgz
          retention-days: 2

  xcode:
    name: Xcode → .ipa (test) or App Store Connect (store)
    needs: unity
    # macos-latest (macOS 26, arm64) kept failing to get a runner (GitHub capacity): macOS 15, with Xcode 26 picked below
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Unpack
        run: mkdir xcode && tar -xzf xcode-project.tgz -C xcode

      # The newest Xcode 26 on the image (the App Store wants the iOS 26 SDK), else the image default.
      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      # The ad SDKs (Google Mobile Ads and the mediation networks) come as CocoaPods: the External Dependency Manager
      # writes the Podfile during the Unity export (CocoaPods isn't on the Linux runner), so they are installed here.
      - name: Install CocoaPods dependencies
        working-directory: xcode
        run: |
          if [ -f Podfile ]; then pod install --repo-update; else echo "No Podfile"; fi

      # No custom encryption (only HTTPS): the export compliance question is answered in the app itself.
      - name: Export compliance
        working-directory: xcode
        run: /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" Info.plist

      # ---------- The store build: archived unsigned, then signed by Apple's cloud signing (the API key, automatic
      # signing: no certificate kept here) while it is exported and uploaded ----------

      - name: Archive and upload to App Store Connect
        if: startsWith(github.ref_name, 'appstore-')
        working-directory: xcode
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          set -o pipefail
          if [ -z "$TEAM_ID" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$API_KEY" ]; then
            echo "::error::Add the APPLE_TEAM_ID, APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID and APPSTORE_API_KEY secrets"; exit 1
          fi
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          if [ -d Unity-iPhone.xcworkspace ]; then TARGET="-workspace Unity-iPhone.xcworkspace"; else TARGET="-project Unity-iPhone.xcodeproj"; fi
          xcodebuild $TARGET -scheme Unity-iPhone -configuration Release -destination generic/platform=iOS \
            -archivePath "$PWD/out/EscapeCell.xcarchive" $AUTH \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 60
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$PWD/out/EscapeCell.xcarchive" -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/out/export" $AUTH | tail -n 40
          rm -f "$KEY"

      # ---------- The test build: unsigned, for Sideloadly ----------

      - name: Compile without signing
        if: ${{ !startsWith(github.ref_name, 'appstore-') }}
        working-directory: xcode
        run: |
          if [ -d Unity-iPhone.xcworkspace ]; then TARGET="-workspace Unity-iPhone.xcworkspace -scheme Unity-iPhone"; else TARGET="-project Unity-iPhone.xcodeproj -target Unity-iPhone"; fi
          xcodebuild $TARGET -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/out" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40

      # Unity ships UnityRuntime.framework already signed with its own identity while the rest of the app is
      # unsigned; installers like Sideloadly then fail with ApplicationVerificationFailed (0xe8008001).
      # Strip every signature and ad-hoc sign the whole bundle so it can be re-signed consistently.
      - name: Ad-hoc sign
        if: ${{ !startsWith(github.ref_name, 'appstore-') }}
        working-directory: xcode
        run: |
          APP=$(ls -d out/Release-iphoneos/*.app)
          find "$APP" -name _CodeSignature -type d -prune -exec rm -rf {} +
          for fw in "$APP"/Frameworks/*.framework; do
            codesign --force --sign - --timestamp=none "$fw"
          done
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package .ipa
        if: ${{ !startsWith(github.ref_name, 'appstore-') }}
        working-directory: xcode
        run: |
          mkdir Payload
          cp -R out/Release-iphoneos/*.app Payload/
          zip -qry ../EscapeCell-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref_name, 'appstore-') }}
        with:
          name: EscapeCell-unsigned-ipa
          path: EscapeCell-unsigned.ipa
          retention-days: 14
